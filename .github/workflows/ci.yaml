name: Helm Chart CI

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'tools/bundled-compat-check/**'
      - '.github/workflows/ci.yaml'
  push:
    branches:
      - main
      - v1.x
    paths:
      - 'charts/**'
      - 'tools/bundled-compat-check/**'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      - name: Add Helm repos
        run: make -C charts/everest add-repos

      - name: Build chart dependencies
        run: make -C charts/everest deps-build

      - name: Run helm lint
        run: helm lint charts/everest --namespace everest-system

      - name: Run helm lint on everest-crds
        run: helm lint charts/everest/charts/everest-crds

      - name: Set up chart-testing
        uses: helm/chart-testing-action@e6669bcd63d7cb57cb4380c33043eebe5d111992 # v2.6.1

      - name: Run ct lint
        run: |
          ct lint \
            --charts charts/everest \
            --validate-maintainers=false

  test-values:
    name: Test Values
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      - name: Add Helm repos
        run: make -C charts/everest add-repos

      - name: Build chart dependencies
        run: make -C charts/everest deps-build

      - name: Run helm template
        run: make -C charts/everest test

      - name: Run helm template on everest-crds
        run: helm template everest-crds charts/everest/charts/everest-crds > /dev/null

  bundled-extensions:
    name: Bundled Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/bundled-compat-check/go.mod
          cache-dependency-path: tools/bundled-compat-check/go.sum

      - name: Test the check
        working-directory: tools/bundled-compat-check
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

      # Chart.yaml gets its compatibility window from the CRDs at release
      # time. Record it here too, so that a dependency bump outside the window
      # fails its pull request rather than the next release.
      - name: Record the compatibility window as a release does
        run: make -C charts/everest annotate-chart VERSION="$(yq '.appVersion' charts/everest/Chart.yaml)"

      - name: Check bundled extensions
        run: make -C charts/everest check-bundled-compat
