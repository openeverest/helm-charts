name: Everest Chart Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Everest version"
        required: true
      chart_version:
        description: "Chart version, if it differs from the Everest version (a chart-only patch, e.g. 2.0.0-dev.4.1)"
        required: false
        default: ""
      branch:
        required: false
        default: main
        description: "Branch or tag to checkout for chart release"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version }}
      CHART_VERSION: ${{ github.event.inputs.chart_version || github.event.inputs.version }}
      # Is set if the VERSION corresponds to an RC.
      IS_RC: 0
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_RC=1" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.branch }}
          sparse-checkout: |
            charts/everest

      # The check comes from this workflow's ref rather than the released one,
      # so that it also runs when a chart-only patch is cut from an older tag.
      - name: Checkout release tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: .release-tools
          sparse-checkout: |
            tools/bundled-compat-check

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .release-tools/tools/bundled-compat-check/go.mod
          cache-dependency-path: .release-tools/tools/bundled-compat-check/go.sum

      - name: Prepare RC
        if: ${{ env.IS_RC == '1' }}
        run: |
          cd charts/everest
          make release-dev

      - name: Prepare release
        if: ${{ env.IS_RC == '0' }}
        run: |
          cd charts/everest
          make release

      # Runs on the prepared chart: its window and its locked dependencies are
      # the ones the next steps package.
      - name: Check bundled extensions
        run: go run -C .release-tools/tools/bundled-compat-check . -chart "${GITHUB_WORKSPACE}/charts/everest"

      - name: Release chart
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Release sub-chart
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        with:
          charts_dir: charts/everest/charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
