apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: everest
  namespace: argocd
spec:
  destination:
    namespace: everest-system
    server: https://kubernetes.default.svc
  ignoreDifferences:
  # If `server.jwtKey` is not set, the Secret will be updated with
  # a new random key on every sync.
  - group: ""
    jsonPointers:
    - /data
    kind: Secret
    name: everest-jwt
    namespace: everest-system
  - group: ""
    jsonPointers:
    - /data
    kind: Secret
    name: everest-accounts
    namespace: everest-system
  # Unless `controller.webhook.certs` is set, the webhook certificate and
  # its CA are regenerated on every sync. Ignore the Secret and the
  # webhooks' caBundle together (see argocd.md).
  - group: ""
    jsonPointers:
    - /data
    kind: Secret
    name: everest-controller-webhook-server-cert
    namespace: everest-system
  - group: admissionregistration.k8s.io
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
    kind: ValidatingWebhookConfiguration
    name: everest-controller-validating-webhook-configuration
  # If `server.tls.enabled=true` without `server.tls.secret.certs` or
  # `server.tls.certificate.create`, the server certificate is
  # regenerated on every sync.
  - group: ""
    jsonPointers:
    - /data
    kind: Secret
    name: everest-server-tls
    namespace: everest-system
  project: default
  source:
    chart: everest
    helm:
      parameters:
      - name: upgrade.preflightChecks
        value: "false"
    repoURL: https://openeverest.github.io/helm-charts/
    targetRevision: 1.3.0
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    # Keeps the sync from overwriting the fields in ignoreDifferences.
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
