{{- if .Values.controller.enabled }}
{{- $replicas := int .Values.controller.replicas }}
{{- if and (gt $replicas 1) (not .Values.controller.leaderElection.enabled) }}
{{- fail "controller.replicas above 1 requires controller.leaderElection.enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: everest-controller
  namespace: {{ include "everest.namespace" . }}
  labels:
    app: everest-controller
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: everest-controller
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: everest-controller
    spec:
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if gt $replicas 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: everest-controller
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- end }}
      containers:
      - name: manager
        {{- $repo := default .Values.server.image.repository .Values.controller.image.repository }}
        {{- $tag := default .Values.server.image.tag .Values.controller.image.tag | default .Chart.AppVersion }}
        {{- $pullPolicy := default .Values.server.image.pullPolicy .Values.controller.image.pullPolicy }}
        image: {{ $repo }}:{{ $tag }}
        imagePullPolicy: {{ $pullPolicy }}
        command:
        - {{ .Values.controller.command }}
        args:
        {{- if .Values.controller.leaderElection.enabled }}
        - --leader-elect
        {{- end }}
        - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
        - --health-probe-bind-address={{ .Values.controller.healthProbeBindAddress }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- /* The controller protects Secrets by default; only turning it off
        needs the flag, so the default render suits any controller image. */}}
        {{- if not .Values.secretProtection.enabled }}
        - --secret-protection=false
        {{- end }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
        resources: {{ toYaml .Values.controller.resources | nindent 10 }}
        {{- if .Values.controller.env }}
        env:
        {{- toYaml .Values.controller.env | nindent 8 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: everest-controller-webhook-server-cert
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        {{- include "everest.podRunAsUser" . | nindent 8 }}
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: everest-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: everest-controller-webhook-server-cert
        secret:
          secretName: everest-controller-webhook-server-cert
{{- end }}
