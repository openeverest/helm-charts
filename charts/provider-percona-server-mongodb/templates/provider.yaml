apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: {{ .Values.provider.name }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
spec:
  componentTypes:
    backup:
      versions:
        - default: true
          image: percona/percona-backup-mongodb:2.11.0
          version: 2.11.0
        - image: percona/percona-backup-mongodb:2.9.1
          version: 2.9.1
    mongod:
      versions:
        - image: percona/percona-server-mongodb:6.0.19-16-multi
          version: 6.0.19-16
        - image: percona/percona-server-mongodb:6.0.21-18
          version: 6.0.21-18
        - image: percona/percona-server-mongodb:7.0.18-11
          version: 7.0.18-11
        - image: percona/percona-server-mongodb:8.0.4-1-multi
          version: 8.0.4-1
        - image: percona/percona-server-mongodb:8.0.8-3
          version: 8.0.8-3
        - default: true
          image: percona/percona-server-mongodb:8.0.12-4
          version: 8.0.12-4
    pmm:
      versions:
        - default: true
          image: percona/pmm-server:2.44.1
          version: 2.44.1
  components:
    backupAgent:
      type: backup
    configServer:
      type: mongod
    engine:
      type: mongod
    monitoring:
      type: pmm
    proxy:
      type: mongod
  topologies:
    replicaSet:
      components:
        backupAgent:
          optional: true
        engine: {}
        monitoring:
          optional: true
    sharded:
      components:
        backupAgent:
          optional: true
        configServer: {}
        engine: {}
        monitoring:
          optional: true
        proxy: {}
      configSchema:
        properties:
          numShards:
            format: int32
            type: integer
        type: object
  uiSchema:
    replicaSet:
      sections:
        basicInfo:
          components:
            version:
              fieldParams:
                label: Database Version
              path: spec.components.engine.version
              uiType: select
          description: Provide the basic information for your new database.
          label: Basic Information
        resources:
          components:
            numberOfNodes:
              fieldParams:
                label: Number of nodes
              path: spec.components.engine.replicas
              uiType: number
              validation:
                max: 7
                min: 1
            resources:
              components:
                cpu:
                  fieldParams:
                    label: CPU
                  path: spec.components.engine.resources.requests.cpu
                  uiType: number
                  validation:
                    max: 10
                    min: 1
                disk:
                  fieldParams:
                    label: Disk
                  path: spec.components.engine.storage.size
                  uiType: number
                  validation:
                    max: 100
                    min: 10
                memory:
                  fieldParams:
                    label: Memory
                  path: spec.components.engine.resources.requests.memory
                  uiType: number
                  validation:
                    max: 10
                    min: 1
              groupType: line
              uiType: group
          description: Configure the resources your new database will have access to.
          label: Resources
      sectionsOrder:
        - basicInfo
        - resources
    sharded:
      sections:
        basicInfo:
          components:
            version:
              fieldParams:
                label: Database Version
              path: spec.components.engine.version
              uiType: select
          description: Provide the basic information for your new database.
          label: Basic Information
        resources:
          components:
            nodesResources:
              components:
                cpu:
                  fieldParams:
                    label: CPU
                  path: spec.components.engine.resources.requests.cpu
                  uiType: number
                  validation:
                    max: 10
                    min: 1
                disk:
                  fieldParams:
                    label: Disk
                  path: spec.components.engine.storage.size
                  uiType: number
                  validation:
                    max: 100
                    min: 10
                memory:
                  fieldParams:
                    label: Memory
                  path: spec.components.engine.resources.requests.memory
                  uiType: number
                  validation:
                    max: 10
                    min: 1
              groupType: line
              uiType: group
            numberOfConfigServers:
              fieldParams:
                defaultValue: 3
                label: Number of configuration servers
              path: spec.components.configServer.replicas
              uiType: number
            numberOfNodes:
              fieldParams:
                label: Number of nodes per shard
              path: spec.components.engine.replicas
              uiType: number
            numberOfRouters:
              fieldParams:
                label: Number of routers
              path: spec.components.proxy.replicas
              uiType: number
            shards:
              fieldParams:
                defaultValue: 2
                label: Number of shards
              path: spec.topology.config.numShards
              uiType: number
          componentsOrder:
            - shards
            - numberOfNodes
            - numberOfConfigServers
          description: Configure the resources for your sharded cluster.
          label: Resources
      sectionsOrder:
        - basicInfo
        - resources
